<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>{% block title %}Linx{% endblock %}</title>
        <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
        <link rel="manifest" href="/static/site.webmanifest">
        <link rel="stylesheet" href="/static/app.css" />
    </head>
    <body>
        <div class="page">
            <header class="topbar">
                <div class="container">
                    <a class="brand" href="/" aria-label="Linx home">
                        <h1 class="brand__name">Linx</h1>
                    </a>

                    <p class="subhead" id="tagline"></p>
                </div>
            </header>

            <main class="main">
                <div class="container">
                    <div class="panel">{% block content %}{% endblock %}</div>
                </div>
            </main>

            <footer class="footer">
                <div class="container">
                    <span>
                        Open-source •
                        <a href="https://github.com/j1banez/linx">GitHub</a>
                    </span>
                </div>
            </footer>
        </div>
        <script>
            const taglines = [
                "May the links be with you.",
                "Hasta la vista, links.",
                "Links, uh, find a way.",
                "Say hello to my little links!",
                "Roads? Where we're going we need links.",
                "Welcome to the party, links.",
                "Nobody puts links in a corner.",
                "In space, no one can hear links shorten.",
                "Links are the way.",
                "He who controls the links, controls the universe.",
                "The links must flow.",
                "Fear is the links killer.",
                "I see links.",
                "Even the smallest links can change the course of the future.",
                "Links are coming.",
                "When you play the game of links, you win, or you die.",
                "I fight for the links.",
                "My mama always said life was like a box of links.",
                "I'm the king of the links!",
                "They may take our lives, but they'll never take our links.",
                "My name is Maximus Decimus Meridius, commander of the Armies of the Links.",
                "They call it a Royale with links.",
                "Links on, links off.",
                "Good morning, links!",
                "Help me, Links-Wan Kenobi. You're my only hope.",
                "Pay no attention to those links behind the curtain!",
                "Keep your friends close, but your links closer.",
                "E.T. links home.",
                "Links, I've a feeling we're not in Kansas anymore.",
            ];
            const el = document.getElementById("tagline");
            if (el && taglines.length > 0) {
                const pick =
                    taglines[Math.floor(Math.random() * taglines.length)];
                el.textContent = pick;
            }

            const dateEls = document.querySelectorAll("[data-ts]");

            if (dateEls.length > 0) {
                const formatter = new Intl.DateTimeFormat(undefined, {
                    year: "numeric",
                    month: "short",
                    day: "2-digit",
                    hour: "2-digit",
                    minute: "2-digit",
                });
                const relativeFormatter = new Intl.RelativeTimeFormat(
                    undefined,
                    {
                        numeric: "auto",
                    },
                );
                const units = [
                    ["year", 31_536_000],
                    ["month", 2_592_000],
                    ["day", 86_400],
                    ["hour", 3_600],
                    ["minute", 60],
                    ["second", 1],
                ];

                dateEls.forEach((node) => {
                    const raw = Number(node.dataset.ts);
                    if (!Number.isFinite(raw)) return;
                    const date = new Date(raw * 1000);
                    const display = formatter.format(date);
                    const diffSeconds = Math.round(
                        (date.getTime() - Date.now()) / 1000,
                    );
                    const absSeconds = Math.abs(diffSeconds);

                    let unit = "second";
                    let value = diffSeconds;
                    for (const [candidate, seconds] of units) {
                        if (absSeconds >= seconds) {
                            unit = candidate;
                            value = Math.round(diffSeconds / seconds);
                            break;
                        }
                    }

                    const relative = relativeFormatter.format(value, unit);
                    node.textContent = `${display} (${relative})`;
                });
            }
        </script>
    </body>
</html>
